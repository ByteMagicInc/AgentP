[package]
name = "agent-p"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ByteMagic Inc <copyright@bytemagic.xyz>"]
description = "A fast podcast downloader with customizable ID3 tagging"
license = "GPL-3.0-only"
repository = "https://github.com/ByteMagicInc/AgentP"
homepage = "https://github.com/ByteMagicInc/AgentP"
readme = "README.md"
keywords = ["podcast", "tui", "downloader", "rss", "id3"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = [".github/", ".claude/", ".cursor/", ".idea/", ".gitignore", "AGENTS.md", "CLAUDE.md", "cliff.toml", "docs/", "release.toml"]

[[bin]]
name = "agentp"
path = "src/main.rs"

[dependencies]
reqwest = "0.13.3"
tokio = { version = "1.52", features = ["full"] }
rss = "2.0"
anyhow = "1.0"
sanitize-filename = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
id3 = "1.14"
chrono = "0.4"
ratatui = "0.30.0"
crossterm = "0.29.0"
dirs = "7"
open = "5"
arboard = "3.4"
urlencoding = "2.1.3"
clap = { version = "4.6", features = ["derive"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
